[project]
name = "calibmiss"
version = "0.1.0"
description = "Calibrated Return Forecasts Under Missing Data"
readme = "README.md"
authors = [{name = "Kairill"}]
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2.0,<3.0",
    "numpy>=1.26.0,<2.0",
    "yfinance>=0.2.40,<1.0",
    "scikit-learn>=1.5.0,<2.0",
    "lightgbm>=4.3.0,<5.0",
    "matplotlib>=3.8.0,<4.0",
    "seaborn>=0.13.0,<1.0",
    "pydantic>=2.7.0,<3.0",
    "pyyaml>=6.0.1,<7.0",
    "joblib>=1.4.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0,<9.0",
    "pytest-cov>=5.0.0,<6.0",
    "ruff>=0.5.0,<1.0",
    "mypy>=1.10.0,<2.0",
    "pre-commit>=3.7.0,<4.0",
    "pandoc>=2.3,<3.0",
]

[build-system]
requires = ["setuptools>=70.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "UP", "W"]
ignore = ["E501"]
fixable = ["ALL"]
unfixable = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
]

[tool.coverage.run]
source = ["src/calibmiss"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]